{% extends 'shop/base.html' %}
{% block title %}حذف {{ product.name }} - موتور شوب{% endblock %}
{% block content %}
<section class="py-32">
  <div class="max-w-xl mx-auto px-4">
    <div class="glass-card rounded-2xl p-8 text-center border border-red-500/20">
      <div class="w-20 h-20 mx-auto rounded-full bg-red-500/10 text-red-400 flex items-center justify-center text-3xl mb-5"><i class="fas fa-triangle-exclamation"></i></div>
      <h1 class="text-2xl font-black mb-3">تأكيد حذف المنتج</h1>
      <p class="text-gray-400 mb-2">هل تريد حذف المنتج التالي نهائيًا؟</p>
      <p class="font-bold text-lg mb-7">{{ product.name }}</p>
      <form method="post" class="flex flex-col sm:flex-row justify-center gap-3">
        {% csrf_token %}
        <button class="px-7 py-3 rounded-xl bg-red-600 hover:bg-red-700 font-bold"><i class="fas fa-trash ml-2"></i>نعم، احذف</button>
        <a href="{% url 'manage_products' %}" class="px-7 py-3 rounded-xl border border-gray-700 hover:border-white font-bold">إلغاء</a>
      </form>
    </div>
  </div>
</section>
{% endblock %}
